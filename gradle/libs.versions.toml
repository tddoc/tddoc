[versions]
junit = "5.14.4"
mavenPublish = "0.37.0"
mavenPluginDev = "1.0.3"
# compileOnly: Maven supplies this at runtime. Stay on the oldest line users
# commonly run (3.9.x) so the Mojo cannot pick up newer-only API.
mavenPluginApi = "3.9.16"
mavenPluginAnnotations = "3.16.0"

[plugins]
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
mavenPluginDev = { id = "org.gradlex.maven-plugin-development", version.ref = "mavenPluginDev" }

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "mavenPluginApi" }
maven-plugin-annotations = { module = "org.apache.maven.plugin-tools:maven-plugin-annotations", version.ref = "mavenPluginAnnotations" }
